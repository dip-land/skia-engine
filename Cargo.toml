[workspace]
members = [
    "crates/core",
    "crates/engine",
    "crates/macro"
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dip-land/skia-engine"
homepage = "https://github.com/dip-land/skia-engine"
authors = ["dip-land", "Sebastain W."]
rust-version = "1.85"
keywords = ["graphics", "skia", "canvas", "rsx", "jsx"]
categories = ["graphics", "rendering::graphics-api", "multimedia::images"]
exclude = [ "*.png" ]

[workspace.dependencies]
skia-engine-core = { version = "0.3", path = "crates/core" }
skia-engine-macro = { version = "0.3", path = "crates/macro" }

proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full", "extra-traits"] }
syn-rsx = "0.9.0"
skia-safe = { version = "0.153.3", features = ["textlayout"] }
